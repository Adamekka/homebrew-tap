# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Test Alacritty cask
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          brew install --cask "$TAP_NAME/alacritty"
          alacritty --version
          TERMINFO="$HOME/.terminfo" infocmp alacritty
          codesign --verify --deep --strict /Applications/Alacritty.app
          test -z "$(xattr -p com.apple.quarantine /Applications/Alacritty.app 2>/dev/null || true)"
          brew uninstall --cask "$TAP_NAME/alacritty"

      - name: Test qBittorrent cask
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          brew install --cask "$TAP_NAME/qbittorrent"
          cask_version="$(brew info --cask --json=v2 "$TAP_NAME/qbittorrent" | plutil -extract casks.0.version raw -o - -)"
          test "$(/Applications/qBittorrent.app/Contents/MacOS/qbittorrent --version)" = "qBittorrent v$cask_version"
          lipo /Applications/qBittorrent.app/Contents/MacOS/qbittorrent -verify_arch x86_64 arm64
          codesign --verify --deep --strict /Applications/qBittorrent.app
          test -z "$(xattr -p com.apple.quarantine /Applications/qBittorrent.app 2>/dev/null || true)"
          brew uninstall --cask "$TAP_NAME/qbittorrent"
          test ! -e /Applications/qBittorrent.app

      - name: Test Wine Staging cask
        if: runner.os == 'macOS'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          brew install --cask "$TAP_NAME/wine@staging"
          gstreamer_version="$(brew info --cask --json=v2 "$TAP_NAME/gstreamer-runtime" | plutil -extract casks.0.version raw -o - -)"
          test "$(/Library/Frameworks/GStreamer.framework/Versions/1.0/bin/gst-inspect-1.0 --version | sed -n '1p')" = "gst-inspect-1.0 version $gstreamer_version"
          test -z "$(xattr -p com.apple.quarantine /Library/Frameworks/GStreamer.framework 2>/dev/null || true)"
          cask_version="$(brew info --cask --json=v2 "$TAP_NAME/wine@staging" | plutil -extract casks.0.version raw -o - -)"
          test "$(wine --version)" = "wine-$cask_version (Staging)"
          lipo "/Applications/Wine Staging.app/Contents/Resources/wine/bin/wine" -verify_arch x86_64
          test -z "$(xattr -p com.apple.quarantine "/Applications/Wine Staging.app" 2>/dev/null || true)"
          brew uninstall --cask "$TAP_NAME/wine@staging"
          test ! -e "/Applications/Wine Staging.app"
          test ! -e "$(brew --prefix)/bin/wine"
          brew uninstall --cask "$TAP_NAME/gstreamer-runtime"
          test ! -e /Library/Frameworks/GStreamer.framework/Versions/1.0/bin/gst-inspect-1.0

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
